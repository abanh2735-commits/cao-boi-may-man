
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cao Bồi May Mắn</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: radial-gradient(#98602e, #241006);
    font-family: Georgia, serif;
    color: #ffe4a1;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 430px;
    max-width: 96%;
    padding: 14px;
    border: 5px solid #b87932;
    border-radius: 20px;
    background: linear-gradient(#70401e, #241208);
    box-shadow: 0 0 35px #000;
}

h1 {
    text-align: center;
    color: gold;
    text-shadow: 2px 3px #542300;
}

.multiplier {
    text-align: center;
    padding: 12px;
    background: #46230e;
    border: 2px solid #bd873e;
    font-size: 21px;
    color: gold;
}

.reels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    padding: 8px;
    margin-top: 12px;
    background: #160b05;
    border: 3px solid #bd873e;
}

.cell {
    aspect-ratio: 1;
    background: linear-gradient(#ffe9b2, #b77a35);
    border: 2px solid #78451e;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(25px, 7vw, 38px);
}
.person-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    display: block;

.cell.win {
    animation: glow .4s infinite alternate;
}

@keyframes glow {
    from { transform: scale(1); filter: brightness(1); }
    to { transform: scale(1.12); filter: brightness(1.7); }
}

.info {
    display: flex;
    justify-content: space-between;
    gap: 5px;
    margin: 12px 0;
}

.info div {
    background: #321b0c;
    border: 1px solid #b87932;
    border-radius: 8px;
    padding: 9px 4px;
    text-align: center;
    flex: 1;
    font-size: 13px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
}

button {
    cursor: pointer;
    color: white;
    background: linear-gradient(#b86a24, #612608);
    border: 2px solid gold;
    border-radius: 12px;
    padding: 12px 18px;
    font-weight: bold;
    font-size: 18px;
}

button:active {
    transform: scale(.95);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#spin {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    font-size: 29px;
    background: radial-gradient(#ffdf7d, #b64e0a);
    color: #421c06;
}

.message {
    text-align: center;
    min-height: 35px;
    margin: 12px 0;
    padding: 8px;
    background: #48250f;
    border: 2px solid #b87932;
}

.extra {
    display: flex;
    gap: 5px;
    margin-top: 12px;
}

.extra button {
    flex: 1;
    font-size: 12px;
    padding: 10px 3px;
}

.panel {
    display: none;
    background: #211006;
    border: 1px solid gold;
    padding: 10px;
    margin-top: 10px;
    max-height: 160px;
    overflow: auto;
    font-size: 13px;
}

.panel.show {
    display: block;
}

.panel p {
    border-bottom: 1px solid #79502a;
    padding-bottom: 5px;
}

.note {
    font: 11px Arial;
    text-align: center;
    color: #e6c99a;
    margin-top: 12px;
}

</style>
</head>

<body>

<div class="game" id="game">

<h1>🤠 CAO BỒI MAY MẮN</h1>

<div class="multiplier">
    ✦ x10 &nbsp; ★ x20 &nbsp; ✦ x50 &nbsp; ✦ x100
</div>

<div class="reels" id="reels"></div>

<div class="message" id="message">
    CHÚC MÀY MAY MẮN!
</div>

<div class="info">
    <div>Xu ảo<br><b id="balance">1000</b></div>
    <div>Cược<br><b id="bet">10</b></div>
    <div>Tổng thắng<br><b id="total">0</b></div>
</div>

<div class="controls">
    <button id="minus">−</button>
    <button id="spin">⟳</button>
    <button id="plus">+</button>
</div>

<div class="extra">
    <button id="historyBtn">📜 Lịch sử</button>
    <button id="statsBtn">📊 Thống kê</button>
    <button id="fullBtn">⛶ Toàn màn hình</button>
</div>

<div class="panel" id="history">
    <h3>LỊCH SỬ QUAY</h3>
    <div id="historyList"></div>
</div>

<div class="panel" id="stats">
    <h3>THỐNG KÊ</h3>
    <div id="statsList"></div>
</div>

<p class="note">
    GAME DEMO GIẢI TRÍ - CHỈ SỬ DỤNG XU ẢO.
    KHÔNG NẠP TIỀN, KHÔNG RÚT TIỀN.
</p>

</div>

<script>

// =========================
// 1. KHAI BÁO DỮ LIỆU
// =========================

const symbols = [
    "92dc227d-e7c6-4327-8252-7c40acf0ed.jfif",
"92dc227d-e7c6-4327-8252-7c40acf0ed.jfif",
"92dc227d-e7c6-4327-8252-7c40acf0ed.jfif",
"92dc227d-e7c6-4327-8252-7c40acf0ed.jfif",
"92dc227d-e7c6-4327-8252-7c40acf0ed.jfif"
];


let balance = 1000;
let bet = 10;
let totalWin = 0;

let turns = 0;
let wins = 0;
let losses = 0;

let spinning = false;
let history = [];

const reels = document.getElementById("reels");

// =========================
// 2. TẠO MÁY QUAY 5 CỘT
// =========================

function randomSymbol() {
    const weights = symbols.map((_, i) =>
        i === 0 ? 0.5 : 0.5 / (symbols.length - 1)
    );

    let r = Math.random();

    for (let i = 0; i < symbols.length; i++) {
        r -= weights[i];

        if (r < 0) {
            return symbols[i];
        }
    }

    return symbols[0];
}

function createGrid() {
    let grid = [];

    for (let r = 0; r < 4; r++) {
        let row = [];

        for (let c = 0; c < 5; c++) {
            row.push(randomSymbol());
        }

        grid.push(row);
    }

    return grid;
}

// =========================
// 3. HIỂN THỊ BIỂU TƯỢNG
// =========================

function drawGrid(grid) {

    reels.innerHTML = "";

    grid.forEach((row, r) => {

        row.forEach((symbol, c) => {

            let cell = document.createElement("div");

            cell.className = "cell";
            cell.cell.innerHTML = `<img src="images/${symbol}" class="person-img" alt="Ảnh">`;

            cell.id = `cell-${r}-${c}`;

            reels.appendChild(cell);

        });

    });

}

// =========================
// 4. CẬP NHẬT SỐ DƯ
// =========================

function update() {

    document.getElementById("balance").textContent =
        balance.toLocaleString("vi-VN");

    document.getElementById("bet").textContent = bet;

    document.getElementById("total").textContent =
        totalWin.toLocaleString("vi-VN");

    document.getElementById("minus").disabled =
        spinning || bet <= 10;

    document.getElementById("plus").disabled =
        spinning || bet >= 100 || bet + 10 > balance;

    document.getElementById("spin").disabled =
        spinning || balance < bet;

}

// =========================
// 5. ÂM THANH
// =========================

let audioContext;

function sound(freq, duration = 0.12) {

    try {

        audioContext = audioContext ||
            new AudioContext();

        let oscillator =
            audioContext.createOscillator();

        let gain = audioContext.createGain();

        oscillator.frequency.value = freq;

        gain.gain.setValueAtTime(
            0.04,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + duration
        );

    } catch (error) {
        console.log("Không phát được âm thanh");
    }

}

// =========================
// 6. TÍNH THƯỞNG
// =========================

function calculateWin(grid) {

    let reward = 0;
    let winningCells = [];

    grid.forEach((row, r) => {

        let count = 1;

        while (
            count < 5 &&
            row[count] === row[0]
        ) {
            count++;
        }

        if (count >= 3) {

            let multiplier = 10;

            if (count === 2) multiplier = 20;
            if (count === 3) multiplier = 50;

            reward += bet * multiplier;

            for (let c = 0; c < count; c++) {
                winningCells.push([r, c]);
            }

        }

    });

    return {
        reward,
        winningCells
    };

}

// =========================
// 7. HIỆU ỨNG TRÚNG THƯỞNG
// =========================

function celebration() {

    document.getElementById("message").textContent =
        "🎉 CHÚC MỪNG! TRÚNG THƯỞNG! 🎉";

    sound(523);
    setTimeout(() => sound(659), 150);
    setTimeout(() => sound(784), 300);
    setTimeout(() => sound(1046), 450);

}

// =========================
// 8. QUAY GAME
// =========================

function spin() {

    if (spinning || balance < bet) return;

    spinning = true;

    balance -= bet;

    turns++;

    update();

    document.getElementById("message").textContent =
        "🎰 ĐANG QUAY...";

    let ticks = 0;

    let timer = setInterval(() => {

        drawGrid(createGrid());

        sound(180, 0.04);

        ticks++;

        if (ticks >= 15) {

            clearInterval(timer);

            let grid = createGrid();

            drawGrid(grid);

            let result = calculateWin(grid);

            result.winningCells.forEach(([r, c]) => {

                document
                    .getElementById(`cell-${r}-${c}`)
                    ?.classList.add("win");

            });

            balance += result.reward;

            totalWin += result.reward;

            if (result.reward > 0) {

                wins++;

                celebration();

                document.getElementById("message").textContent =
                    "🎉 THẮNG " +
                    result.reward.toLocaleString("vi-VN") +
                    " XU ẢO!";

            } else {

                losses++;

                document.getElementById("message").textContent =
                    "CHƯA TRÚNG! THỬ LẠI NHÉ.";

            }

            history.unshift({
                turn: turns,
                bet: bet,
                reward: result.reward
            });

            history = history.slice(0, 20);

            renderHistory();
            renderStats();

            spinning = false;

            update();

        }

    }, 100);

}

// =========================
// 9. LỊCH SỬ
// =========================

function renderHistory() {

    let html = "";

    history.forEach(item => {

        html += `
            <p>
            Lượt ${item.turn}
            | Cược: ${item.bet}
            | Thắng: ${item.reward}
            </p>
        `;

    });

    document.getElementById("historyList").innerHTML =
        html || "Chưa có dữ liệu.";

}

// =========================
// 10. THỐNG KÊ
// =========================

function renderStats() {

    document.getElementById("statsList").innerHTML = `
        Tổng lượt quay: ${turns}<br>
        Số lượt thắng: ${wins}<br>
        Số lượt không trúng: ${losses}<br>
        Tổng xu thắng: ${totalWin}<br>
        Tỷ lệ thắng: ${
            turns ? Math.round(wins / turns * 100) : 0
        }%
    `;

}

// =========================
// 11. CÁC NÚT ĐIỀU KHIỂN
// =========================

document.getElementById("spin").onclick = spin;

document.getElementById("minus").onclick = () => {

    if (bet > 10) {
        bet -= 10;
        update();
    }

};

document.getElementById("plus").onclick = () => {

    if (bet < 100 && bet + 10 <= balance) {
        bet += 10;
        update();
    }

};

document.getElementById("historyBtn").onclick = () => {

    document.getElementById("history")
        .classList.toggle("show");

};

document.getElementById("statsBtn").onclick = () => {

    document.getElementById("stats")
        .classList.toggle("show");

};

// =========================
// 12. TOÀN MÀN HÌNH
// =========================

document.getElementById("fullBtn").onclick = async () => {

    try {

        if (!document.fullscreenElement) {

            await document.getElementById("game")
                .requestFullscreen();

        } else {

            await document.exitFullscreen();

        }

    } catch (error) {

        console.log(error);

    }

};

// =========================
// 13. KHỞI ĐỘNG GAME
// =========================

drawGrid(createGrid());

update();

renderStats();

</script>

</body>
</html>
